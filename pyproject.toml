[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[project]
name = "pystorm-a8c"
# Pre-release while this branch is in review. Drop the `b1` to cut 1.0.0 --
# see doc/RELEASING.md. The docs already describe the package as 1.0.0.
version = "1.0.0b1"
description = "Slim Apache Storm multi-lang runtime, topology DSL, and Nimbus submit client for Parse.ly"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Parse.ly / Automattic" }]
dependencies = ["thriftpy2>=0.4.11"]

[project.optional-dependencies]
# tomli only for 3.9/3.10; tomllib is stdlib from 3.11. Test-only -- this does
# not touch the one-runtime-dependency rule.
test = ["pytest>=7", "pytest-timeout>=2", "tomli>=2; python_version < '3.11'"]
lint = ["black>=24"]

[project.scripts]
pystorm_a8c_run = "pystorm_a8c.run:main"
pystorm-a8c = "pystorm_a8c.cli:main"

[tool.uv.build-backend]
module-root = ""
module-name = ["pystorm_a8c"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-vv --timeout=30"
