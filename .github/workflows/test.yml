name: test
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-slim
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --python ${{ matrix.python-version }} --extra test pytest -q

  lint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Keep this list in sync with the `lint` target in the Makefile.
      # streamparse/ ships in the wheel, so it is checked too.
      - run: uv run --extra lint black --check pystorm_a8c streamparse test
