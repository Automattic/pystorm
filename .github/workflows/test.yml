name: test
# push only. Adding pull_request would run every branch twice, since a PR from
# this repo already gets a push event for the same commit.
on: push

jobs:
  test:
    # ubuntu-latest, not ubuntu-slim: the slim runner is the bare ubuntu:24.04
    # image and has no make, which the steps below rely on.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Pin the interpreter the way a developer would, then run the same target
      # they run. uv reads .python-version, so `make test` needs no
      # matrix-aware flag and CI cannot drift from the local command.
      - run: echo "${{ matrix.python-version }}" > .python-version
      - run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: make lint
